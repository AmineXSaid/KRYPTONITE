# OpenRouter
# Generated by KRYPTONITE. Edit freely — the file is the source of truth.
#
# Verified against the live endpoint: completion, SSE streaming and tool
# calling all pass. `openrouter/free` is an auto-router — each request is
# served by whichever free model is available, so the `model` field in a
# response will differ from the one requested. That is expected.

name: openrouter
description: OpenRouter
wire: openai                      # openai | anthropic | raw
baseUrl: https://openrouter.ai/api/v1
model: openrouter/free

# baseUrl already carries /v1, so the default route resolves to
# /chat/completions rather than /v1/chat/completions. Set this only to override.
# chatPath: /chat/completions
timeoutMs: 120000
retries: 2

auth:
  kind: bearer                    # none | bearer | header | exchange | exec
  value: ${secret:openrouter/api_key}
  # The key lives in VS Code SecretStorage under
  # kryptonite.openrouter/api_key — not in this file.
  # Paste it into the API Key field in the endpoint form, then Check connection.

tls:
  caBundle: [system]              # "system" pulls the OS trust store

proxy:
  useEnvironment: true            # honour HTTPS_PROXY / NO_PROXY

capabilities:
  streaming: true
  tools: true
  vision: false
  systemRole: message             # message | top-level | prepend-user
  contextWindow: 128000
  maxOutputTokens: 4096
  tokenCounting: heuristic        # api | heuristic
  parallelToolCalls: false
