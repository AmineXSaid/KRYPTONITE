name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20 is what the VS Code 1.90 extension host runs, so it is the floor.
        # Windows is not redundant here: the host resolves workspace-relative
        # paths through path.sep and keys session storage off the workspace
        # path, and those are exactly the places a POSIX-only run would miss.
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins and fails if the
      # lockfile has drifted from package.json — which is the whole point of
      # committing it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `pretest` builds dist/extension.js (required by test/host.js) and
      # bundles the TypeScript suites against test/vscode-stub.ts.
      #
      # This runs the seven suites that need nothing but Node. The other three
      # are deliberately excluded: attachment-e2e and skill-gating-live call a
      # real model endpoint and need OR_KEY, and mcp-e2e spawns an MCP server
      # package that is not a declared dependency. Run those locally with
      # `npm run test:live` and `npm run test:mcp`.
      - name: Test
        run: npm test

  # The MCP servers under mcp-servers/ are Python, and they carry the
  # read-only guard that makes them safe to point at a corporate instance. A
  # guard nothing runs in CI is a guard that decays, so this job exists even
  # though it shares no code with the extension above.
  #
  # It runs on every push, like the rest. GitHub has no per-job path filter,
  # and setting one on the workflow would gate the extension's jobs too;
  # installing Python and four small packages is cheaper than that trade.
  mcp-servers:
    name: mcp-servers (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml, so it is the one that
        # matters; 3.13 catches a deprecation before it becomes a break.
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: mcp-servers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      # No network is touched: every test drives the client through
      # httpx.MockTransport, and the read-only guard is asserted against a
      # transport that raises if it is ever called.
      - name: Test
        run: pytest -q

      # Cheap, and it is the failure that would otherwise reach a user as a
      # crash on startup rather than as a red build.
      - name: Servers import
        run: |
          python -c "import jira_mcp.server, confluence_mcp.server"
          python -c "import gitlab_mcp.server, jenkins_mcp.server"

      # probe.py is the thing a user runs first. With nothing configured it
      # must exit non-zero and say what is missing, rather than tracebacking.
      - name: Probe refuses to run unconfigured
        run: |
          if python probe.py; then
            echo "probe.py exited 0 with no configuration"; exit 1
          fi

  package:
    name: package vsix
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # The same command a developer runs, so it uses the vsce pinned in the
      # lockfile rather than whatever npx would resolve. Proves the extension
      # actually packages, and leaves the .vsix on the run so an air-gapped
      # install can be fetched without going through a marketplace.
      # `npm run package` also validates the archive it produced - see
      # test/vsix.cjs. That check cannot run anywhere else: it is the only one
      # that looks at what .vscodeignore actually let through, and a file
      # excluded by mistake fails at runtime with no build error at all.
      - name: Package and validate the archive
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: kryptonite-vsix
          path: "*.vsix"
          if-no-files-found: error
